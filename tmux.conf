# tmux só do jfy (socket -L jfy): não mexe no seu tmux normal
set -g mouse on
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g history-limit 50000
set -g base-index 0
set -g allow-rename off
set -g automatic-rename off
set -g status-position bottom
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold,fg=colour39] jfy "
set -g status-left-length 10
set -g status-right "#[fg=colour244]menu: clique em #[fg=colour39,bold]0 menu#[fg=colour244,nobold] ou Ctrl-b e depois 0  ·  /exit no Claude encerra a task "
set -g status-right-length 120
set -g window-status-format " #I #W "
set -g window-status-current-format "#[reverse,bold] #I #W "
# aba fica vermelha quando o Claude toca o sino (pede atenção)
set -g monitor-bell on
set -g bell-action other
set -g window-status-bell-style "bg=colour203,fg=colour232,bold"

# aba do menu sempre destacada
set -g window-status-format "#{?#{==:#I,0},#[fg=colour39#,bold],} #I #W "
